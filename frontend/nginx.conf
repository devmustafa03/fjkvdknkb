server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css image/svg+xml;

  include /etc/nginx/snippets/headers.conf;

  location /api/ {
    # Re-resolve so a recreated api container is still found
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    include /etc/nginx/snippets/headers.conf;
    # A cached shell would point at assets a redeploy removed
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
